plugins {
    id 'com.squareup.wire' version '6.4.1'
}

wire {
    java {
    }
}

dependencies {
    implementation project(':timeago-parser')

    implementation "com.github.TeamNewPipe:nanojson:$nanojsonVersion"
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation "org.java-websocket:Java-WebSocket:1.6.0"
    implementation "com.github.spotbugs:spotbugs-annotations:$spotbugsVersion"
    implementation 'org.nibor.autolink:autolink:0.12.0'
    implementation "com.google.protobuf:protobuf-java:4.35.1"
    implementation "com.squareup.okhttp3:okhttp:5.4.0"
    implementation "org.brotli:dec:0.1.2"
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
    compileOnly "org.json:json:20260522"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
    // org.json is compileOnly for main (Android provides it built-in), but the
    // desktop test JVM has no org.json — supply it at test runtime to avoid
    // NoClassDefFoundError: org/json/JSONException when StreamInfo.getInfo runs.
    testRuntimeOnly "org.json:json:20231013"
}

test {
    useJUnitPlatform()
    // Forward env vars to test JVM
    environment 'YT_COOKIES', System.getenv('YT_COOKIES') ?: ''
    environment 'DOWNLOADER_DEBUG', System.getenv('DOWNLOADER_DEBUG') ?: ''
    environment 'DISABLE_WEB_REMIX', System.getenv('DISABLE_WEB_REMIX') ?: ''
    // Always re-run, never use cached result
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}
